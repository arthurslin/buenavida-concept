<script>
(function () {
  var SALT = 'oRK3t04P5lQ1kZ56rYZQLQ==', ITER = 310000, STORE = 'bv-key-' + SALT;
  var el = document.getElementById('payload');
  function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function show(html) { var go = function () { document.open(); document.write(html); document.close(); }; if (document.readyState === 'complete') go(); else window.addEventListener('load', go); }
  function open(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(el.dataset.iv) }, key, bytes(el.textContent.trim()))
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (k) {

    });
  }
  function ask() {
    var gate = document.getElementById('gate'), form = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err');
    gate.hidden = false; pw.focus();
    form.addEventListener('submit', function (e) {
      e.preventDefault(); go.disabled = true; go.textContent = 'Unlocking…'; err.textContent = '';
      var key;
      derive(pw.value).then(function (k) { key = k; return open(k); }).then(function (html) {
        return crypto.subtle.exportKey('raw', key).then(function (raw) {
          try { sessionStorage.setItem(STORE, btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); } catch (x) {}
